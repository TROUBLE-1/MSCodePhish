<div id="campaign-report-overlay" class="popup-overlay campaign-report-overlay" style="display: none;" aria-hidden="true">
    <div id="campaign-report-popup" class="popup-box campaign-report-popup" role="dialog" aria-modal="true" aria-labelledby="campaign-report-title">
        <div class="campaign-report-popup-header">
            <h3 id="campaign-report-title">Security Assessment Report</h3>
            <div class="campaign-report-popup-actions">
                <button type="button" class="btn btn-sm" id="campaign-report-print">Print / Save PDF</button>
                <button type="button" class="btn btn-sm btn-primary" id="campaign-report-close">Close</button>
            </div>
        </div>
        <iframe id="campaign-report-frame" class="campaign-report-frame app-scroll" title="Campaign security assessment report"></iframe>
    </div>
</div>
